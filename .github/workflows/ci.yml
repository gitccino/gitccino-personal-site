name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs on the same branch when you push again
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Lint / Build / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run format:check
      - run: bun run lint
      - run: bun run build
      - run: bun run --filter @gitccino/api typecheck

  test:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gitccino_test
          POSTGRES_USER: gitccino
          POSTGRES_PASSWORD: gitccino_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitccino -d gitccino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The test scripts hardcode --env-file=../../.env, so it must exist
      - name: Write .env for CI
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          TEST_DATABASE_URL=postgresql://gitccino:gitccino_local@localhost:5432/gitccino_test
          DATABASE_URL=postgresql://gitccino:gitccino_local@localhost:5432/gitccino_test
          WEB_ORIGIN=http://localhost:5173
          TRUST_PROXY=false
          UPSTASH_REDIS_REST_URL=
          UPSTASH_REDIS_REST_TOKEN=
          EOF

      - name: Unit tests
        run: bun run test:api

      - name: Integration tests
        run: bun run test:integration
